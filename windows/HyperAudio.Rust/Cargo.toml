[package]
name = "hyperaudio"
version = "0.6.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/li-junlei/HyperAudio-Bridge"
description = "LAN audio receiver for HyperAudio Bridge"
build = "build.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
cpal = "0.16"
gpui = "=0.2.2"
if-addrs = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
mdns-sd = "0.13"
opus-decoder = "0.1.1"
p12-keystore = "0.4.1"
qrcode = "0.14"
raw-window-handle = "0.6"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tray-icon = "0.21"
url = "2"
windows-registry = "0.5"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
