name: 问题报告
description: 报告可复现的故障
body:
  - type: markdown
    attributes:
      value: 请勿上传配对码、令牌、私钥或未脱敏日志。
  - type: input
    id: versions
    attributes:
      label: 两端版本及系统环境
      description: Android/HyperOS、LSPosed/Root 环境、Windows 版本。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请说明是否涉及息屏、唤醒、换网或后台切换。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断信息
      description: 提供对应时段的日志；先移除设备名称、地址和其他个人信息。
